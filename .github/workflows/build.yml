name: Build Android APK

# يشتغل تلقائياً عند رفع t-student-web.zip (أو تعديل هذا الملف)، ويدوياً من تبويب Actions
on:
  workflow_dispatch:
  push:
    paths:
      - 't-student-web*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  APP_ID: com.staionp01.tstudent
  APP_NAME: T-Student
  KS_PASS: tstudent-ks-2026
  # يُحسب تلقائياً من اسم المستودع (GitHub Pages) ويجعل التطبيق يفتح موقعك مباشرة
  # فتصل التحديثات لكل المستخدمين بزر "حدّث الآن" بدون إعادة تثبيت APK

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and stamp version
        run: |
          mkdir -p site
          ZIP=$(ls -t t-student-web*.zip 2>/dev/null | head -n 1)
          [ -n "$ZIP" ] || { echo "::error::no t-student-web*.zip found in repo root"; exit 1; }
          echo "Using: $ZIP"
          unzip -o -j "$ZIP" -d site
          test -f site/T-Student.html || { echo "::error::T-Student.html not found in zip"; exit 1; }
          # رقم نسخة جديد في كل رفع => المتصفح يكتشف التحديث ويظهر الشريط
          sed -i "s/const C=\"[^\"]*\"/const C=\"ts-b${{ github.run_number }}\"/" site/sw.js
          cp site/T-Student.html site/index.html
          grep -o 'const C="[^"]*"' site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  build:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack web app (from t-student-web.zip)
        run: |
          mkdir -p web
          ZIP=$(ls -t t-student-web*.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"
            unzip -o -j "$ZIP" -d web
          else
            echo "No zip found, using loose files from repo root"
            cp T-Student.html splash.js sw.js manifest.json icon.svg rain.b64 web/ 2>/dev/null || true
            cp ./*.png web/ 2>/dev/null || true
          fi
          if [ ! -f web/T-Student.html ]; then
            echo "::error::T-Student.html not found (zip is empty or has the wrong files)"
            exit 1
          fi
          ls -la web

      - name: Prepare www
        run: |
          mkdir -p www
          cp web/* www/
          cp web/T-Student.html www/index.html

      - name: Live URL (GitHub Pages)
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "LIVE_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"

      - name: Capacitor config
        run: |
          node -e '
            const c = {
              appId: process.env.APP_ID,
              appName: process.env.APP_NAME,
              webDir: "www",
              server: { androidScheme: "https" },
              plugins: { SocialLogin: { providers: { google: true, facebook: false, apple: false, twitter: false } } }
            };
            if (process.env.LIVE_URL) c.server.url = process.env.LIVE_URL;
            require("fs").writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
          '
          cat capacitor.config.json

      - name: Install Capacitor and add Android
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capgo/capacitor-social-login@8 @capacitor/local-notifications@8
          npx cap add android
          npx cap sync android

      - name: Patch MainActivity for Google sign-in
        run: |
          F=$(find android -name MainActivity.java | head -n 1)
          echo "MainActivity: $F"
          cat > "$F" << 'JAVA'
          package com.staionp01.tstudent;

          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import com.getcapacitor.PluginHandle;
          import com.getcapacitor.Plugin;
          import android.content.Intent;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {

              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                      if (pluginHandle == null) {
                          Log.i("Google Activity Result", "SocialLogin login handle is null");
                          return;
                      }
                      Plugin plugin = pluginHandle.getInstance();
                      if (!(plugin instanceof SocialLoginPlugin)) {
                          Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin");
                          return;
                      }
                      ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                  }
              }

              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          JAVA

      - name: App icons
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          SRC=web/icon-512.png
          [ -f "$SRC" ] || SRC=web/icon-maskable-512.png
          [ -f "$SRC" ] || SRC=web/icon-192.png
          echo "Icon source: $SRC"
          rm -rf $RES/mipmap-anydpi-v26
          for d in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $d
            mkdir -p $RES/mipmap-$1
            convert "$SRC" -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            cp $RES/mipmap-$1/ic_launcher.png $RES/mipmap-$1/ic_launcher_round.png
            rm -f $RES/mipmap-$1/ic_launcher_foreground.png
          done

      - name: Signing key (created once, then reused)
        run: |
          if [ ! -f t-student.jks ]; then
            keytool -genkeypair -v -keystore t-student.jks -alias tstudent \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=T-Student, O=T-Student, C=SA"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add t-student.jks
            git commit -m "Add signing keystore"
            git push
          fi
          cp t-student.jks android/app/t-student.jks
          cat >> android/app/build.gradle << GRADLE

          android {
              signingConfigs {
                  release {
                      storeFile file("t-student.jks")
                      storePassword "$KS_PASS"
                      keyAlias "tstudent"
                      keyPassword "$KS_PASS"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/*.apk T-Student.apk
          ls -la T-Student.apk

      - name: Show package name and SHA-1
        run: |
          {
            echo "## Package name"
            echo "\`$APP_ID\`"
            echo "## SHA-1"
            keytool -list -v -keystore t-student.jks -alias tstudent -storepass "$KS_PASS" | grep -E "SHA1|SHA-1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: T-Student-APK
          path: T-Student.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T-Student build ${{ github.run_number }}
          files: T-Student.apk
